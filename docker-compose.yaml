services:
  mongodb:
    image: mongo:7.0.14
    container_name: vehicle-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: